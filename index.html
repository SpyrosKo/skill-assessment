<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script>
      const body = document.querySelector("body");

      // array of 5 movies
      const movies = ["LOTR", "Legend", "Alien", "Dune", "Event Horizon"];
      // create container to hold something?
      const container = document.createElement("div");
      body.appendChild(container);

      // create a button event handler to create filtered list
      const button = document.createElement("button");
      button.textContent = "Filter long titles";
      body.appendChild(button);

      // Click event on button
      // filter through the movies to find movies with more that 8 letters.
      button.addEventListener("click", (e) => {
        container.innerHTML = "";

        // filter movies
        const filtered = movies.filter((movie) => {
          return movie.length > 8;
        });

        // Walk through filtered movies
        filtered.forEach(filter => { 
        const walking = document.createElement("div");
        walking.textContent = filter;

        container.appendChild(walking);
        })
      });
    </script>

    <script src="app.js"></script>
  </body>
</html>

<!-- You're building a page that displays a list of five movie titles. There's a button that filters the list to show only movies that have more than 8 letters in the title. Clicking again shows all of them again. -->
