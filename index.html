<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The javascript learning page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script>
      // build the body so i can attach other stuff
      const body = document.body;
      console.log(body);

      // Create button for user interaction
      const button = document.createElement("button");
      button.textContent = "Menu";
      body.appendChild(button);

      const menuContainer = document.createElement("ul");
      body.appendChild(menuContainer);
      menuContainer.classList.add("menu-container");

      // Create what will be cycled through
      const menuItems = ["One", "Two", "Three"];

      menuItems.forEach((item) => {
        const li = document.createElement("li");
        li.textContent = item;
        menuContainer.appendChild(li);
      });

      // let expanded = false;
      // if not using .toggle(), but instead using an if/else, .add()/.remove()

      button.addEventListener("click", (e) => {
        menuContainer.classList.toggle("expanded");
      });

      // button.addEventListener("click", () => {
      //   expanded = !expanded;

      //   if (expanded) {
      //     menuContainer.classList.add("expanded");
      //   } else {
      //     menuContainer.classList.remove("expanded");
      //   }
      // });

      // expanded = !expanded;
      // if not using .toggle(), but instead using an if/else, .add()/.remove()
    </script>

    <script src="app.js"></script>
  </body>
</html>
